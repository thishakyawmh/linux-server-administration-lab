name: Shell Script CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "audit/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Test backup script
        run: bash tests/backup-lab-test.sh
